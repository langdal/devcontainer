# Ubuntu 24.04 LTS cloud image — happy-path baseline.
# Ubuntu 23.10+ ships kernel.apparmor_restrict_unprivileged_userns=1 which
# blocks rootless DinD. Most --dind scenarios assume sysctl=0; scenario 15
# explicitly sets it to 1 via snapshot/restore. Set the baseline to 0 here.
# Immutable dated snapshot (the moving releases/24.04/release/ URL gets
# re-published every few weeks, which breaks the sha pin). To bump: pick
# the newest release-* dir at https://cloud-images.ubuntu.com/releases/noble/
# and take the matching hash from its SHA256SUMS.
IMAGE_URL="https://cloud-images.ubuntu.com/releases/noble/release-20260615/ubuntu-24.04-server-cloudimg-amd64.img"
IMAGE_SHA256="5fa5b05e5ec239858c4531485d6023b0896448c2df7c63b34f8dae6ea6051a44"
CLOUD_USER="ubuntu"
PACKAGES="docker.io docker-buildx podman jq rsync git"
PACKAGE_INSTALL_CMD="apt-get install -y --no-install-recommends"
POST_BOOT_CMDS="sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true"
